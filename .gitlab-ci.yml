pages:
  stage: deploy
  image: node:22-alpine
  script:
    - export VITE_BASE="/$(echo "$CI_PROJECT_NAME" | tr '[:upper:]' '[:lower:]')/"
    - cd client
    - npm ci
    - npm run build
    - cp build/index.html build/404.html
    - mv build ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
